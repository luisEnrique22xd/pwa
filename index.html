<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera PWA</title>
<!-- Vincular el manifest-->
    <link rel="manifest" href="/manifest.json">
<!-- Definir el color de la barra de navegacion en moviles -->
    <meta name="theme-color" content="#1976d2">
</head>
<body>
    <h1>Bienvenido a mi PWA</h1>
    <p>Se puede instalar como aplicacion en el celular</p>
    <button onclick="alert('hola desde la pwa')">Click</button>
    <script>
        if('serviceWorker' in navigator){
            navigator.serviceWorker.register('/repo/sw.js')
            .then(reg => console.log('Registro de SW exitoso', reg))
            .catch(err => console.warn('Error al tratar de registrar el SW', err))
        }
    </script>
</body>
</html>
